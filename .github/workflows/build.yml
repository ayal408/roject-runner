name: Build Windows EXE
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Build standalone Windows application
        run: x86_64-w64-mingw32-g++ -std=c++17 -O2 -static -municode -mwindows source/main.cpp -o ProjectRunner.exe -lshell32 -lole32 -luuid
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectRunner-Windows-x64
          path: |
            ProjectRunner.exe
            README.txt

  windows-smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ProjectRunner-Windows-x64
      - name: Check saved groups, parallel launch, duplicate prevention, and stop
        shell: pwsh
        run: |
          $process = Start-Process .\ProjectRunner.exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(45000)) {
            $process.Kill()
            throw 'Smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }
